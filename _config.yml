# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Lorenzo Ghiro"
title: "Assistant Professor, PhD in Information and Communication Technology"
institution: "University of Brescia, Italy"
email: lorenzo.ghiro@unibs.it
photo: ghiro.png  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.it/citations?user=buh0S5UAAAAJ&hl=en"
  github: "https://github.com/lorenzo-ghiro"
  # researchgate: "https://www.researchgate.net/"
  orcid: "https://orcid.org/0000-0002-3372-422X"
  twitter: ""
  linkedin: "https://www.linkedin.com/in/lorenzo-ghiro-250297241"
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#2a6fad"      # theme color for links and buttons
dark_mode: false             # show dark mode toggle in navbar
content_width: "1400px"      # max width of main content area (e.g. 1200px, 1600px, none)
content_padding: "2rem"    # left/right padding inside the main content area (2rem, 4rem, 6rem, etc.)
bg_primary: "#FAFCFF"        # main page background color
bg_secondary: "#e6edf7"      # sidebar / cards background color
description: "Academic webpage of Dr. Lorenzo Ghiro"
baseurl: ""
url: "https://lorenzoghiro.com"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
show_news: true          # show news block on home page sidebar
nav_pages:
  - name: resume
  - name: publications
  # - name: talks
  # - name: research
  # - name: software
    # collection: software       # uncomment when _software/ folder exists
  # - name: team
  - name: teaching
  - name: tutorials
    collection: tutorials        # auto-populates accordion from _tutorials/
  # - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
collections:
  tutorials:
    output: true
    permalink: /tutorials/:name/

include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap", "jekyll-target-blank"]

scholar:
  last_name: Ghiro
  first_name: [Lorenzo]
  style: citesty
  locale: en
  source: /assets/
  bibliography: references.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
  - just-the-docs-main
