{% if site.show_news != false %}
<div class="section-card" style="margin-top: var(--space-6);">
<h4 style="margin-top: 0;">News</h4>
<div class="news-timeline">
{% assign news_items = site.news | sort: 'path' | reverse %}
{% for article in news_items limit:3 %}
{% include news-item.html news=article %}
{% endfor %}
</div>
<p style="margin-top: var(--space-4);"><a href="{{ site.url }}{{ site.baseurl }}/news/">See all news &rarr;</a></p>
</div>
{% endif %}
